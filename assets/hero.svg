<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">MADlK — C#, C++, Kotlin, WPF, Web, Databases, Testing</title>
  <desc id="heroDesc">Developer profile banner with a terminal card and technology badges</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="72" y1="120" x2="520" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.16"/>
    </linearGradient>

    <radialGradient id="purpleGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1030 30) rotate(90) scale(280)">
      <stop stop-color="#7C3AED" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1180 300) rotate(90) scale(230)">
      <stop stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="greenGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(590 290) rotate(90) scale(170)">
      <stop stop-color="#34D399" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>

    <linearGradient id="pillBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.025"/>
    </linearGradient>

    <filter id="cardShadow" x="660" y="0" width="520" height="300" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="1030" cy="30" r="280" fill="url(#purpleGlow)"/>
  <circle cx="1180" cy="300" r="230" fill="url(#cyanGlow)"/>
  <circle cx="590" cy="290" r="170" fill="url(#greenGlow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="23.25" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <circle cx="1090" cy="42" r="3.5" fill="#22D3EE" opacity="0.8">
    <animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1128" cy="76" r="2.5" fill="#A78BFA" opacity="0.7">
    <animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1052" cy="92" r="2" fill="#34D399" opacity="0.6">
    <animate attributeName="opacity" values="0.15;0.8;0.15" dur="5s" begin="1.4s" repeatCount="indefinite"/>
  </circle>

  <text x="72" y="92" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="6" fill="#818CF8">ПРИВЕТ, Я</text>

  <text x="72" y="178" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-1.5" fill="url(#nameGrad)">MADlK</text>

  <text x="72" y="214" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">Разработчик · чистый код · понятные интерфейсы</text>

  <g font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="13" font-weight="600" fill="#CBD5E1">
    <rect x="72" y="238" width="56" height="30" rx="15" fill="url(#pillBg)" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="100" y="258" text-anchor="middle">C#</text>

    <rect x="136" y="238" width="64" height="30" rx="15" fill="url(#pillBg)" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="168" y="258" text-anchor="middle">C++</text>

    <rect x="208" y="238" width="86" height="30" rx="15" fill="url(#pillBg)" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="251" y="258" text-anchor="middle">Kotlin</text>

    <rect x="302" y="238" width="70" height="30" rx="15" fill="url(#pillBg)" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="337" y="258" text-anchor="middle">WPF</text>

    <rect x="380" y="238" width="70" height="30" rx="15" fill="url(#pillBg)" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="415" y="258" text-anchor="middle">Web</text>

    <rect x="458" y="238" width="70" height="30" rx="15" fill="url(#pillBg)" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="493" y="258" text-anchor="middle">SQL</text>

    <rect x="536" y="238" width="96" height="30" rx="15" fill="url(#pillBg)" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="584" y="258" text-anchor="middle">Testing</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="720" y="52" width="408" height="196" rx="16" fill="#0B1220" stroke="#FFFFFF" stroke-opacity="0.10"/>
  </g>
  <path d="M720 88H1128" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <circle cx="744" cy="70" r="5" fill="#F87171"/>
  <circle cx="762" cy="70" r="5" fill="#FBBF24"/>
  <circle cx="780" cy="70" r="5" fill="#34D399"/>
  <text x="800" y="75" font-family="'Cascadia Code', 'Consolas', monospace" font-size="12" fill="#64748B">madlk@github — zsh</text>

  <g font-family="'Cascadia Code', 'Consolas', monospace" font-size="14.5">
    <text x="744" y="136">
      <tspan fill="#A78BFA">$</tspan>
      <tspan fill="#E2E8F0"> dotnet build</tspan>
    </text>
    <text x="744" y="162">
      <tspan fill="#34D399">✓</tspan>
      <tspan fill="#94A3B8"> Build succeeded</tspan>
    </text>
    <text x="744" y="188">
      <tspan fill="#A78BFA">$</tspan>
      <tspan fill="#E2E8F0"> git push origin main</tspan>
    </text>
    <text x="744" y="214">
      <tspan fill="#34D399">✓</tspan>
      <tspan fill="#94A3B8"> Everything up-to-date</tspan>
    </text>
    <text x="744" y="240" font-weight="700">
      <tspan fill="#A78BFA">&gt;</tspan>
    </text>
  </g>
  <rect x="766" y="226" width="8" height="17" rx="1" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
